# No watermark boost: after a large contiguous allocation (the video decoder's CMA pictures) the kernel raised its free
# reserve from 0.9 to 5 MB for a while, and on this 52 MB screen that is what tipped a projection session over: its
# video side was OOM-killed with 3 MB free. The boost is for big machines' anti-fragmentation.
vm.watermark_boost_factor = 0

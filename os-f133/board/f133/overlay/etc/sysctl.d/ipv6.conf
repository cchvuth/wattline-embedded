# (the T113 Dash's) IPv6 stays link-local: no router advertisements, so no SLAAC address. A global one would carry the
# Wi-Fi MAC and put the screen's SSH in reach beyond the home router's IPv4 NAT. S02sysctl applies this before the
# Wi-Fi driver loads, so wlan0 takes the default.
net.ipv6.conf.default.accept_ra = 0
net.ipv6.conf.all.accept_ra = 0

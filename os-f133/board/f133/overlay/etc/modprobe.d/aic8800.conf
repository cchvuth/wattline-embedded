# the firmware path for any load of aic8800_bsp (S05wifi gives it too; mdev no longer loads it by its SDIO alias, as
# S10mdev has no coldplug here); the driver's default is the Android /vendor/etc/firmware, linked to it too
options aic8800_bsp aic_fw_path=/lib/firmware/aic8800
# errors only (the driver's default logs every received A-MSDU: a flooded log, written to the card every 5 s)
options aic8800_fdrv aicwf_dbg_level=1

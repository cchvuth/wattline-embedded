# The card image (post-image.sh): U-Boot (the SPL and U-Boot proper) raw at 8 KiB; 2 MiB in, outside every partition,
# the area the SPL saves its log to (patches/uboot 0001: 768 sectors); p1 FAT32, 4 GiB at 4 MiB, 32 KiB clusters
# (131 thousand: /init's fsck.fat checks it in under a second and little RAM), with the system: Image, f133.dtb,
# rootfs.sqfs. An update's .try files, its download and an addition's folders go there too. /data, p2, is not in the
# image: the first start makes it over the rest of the card (dash-mkdata, ext4), and a card flashed again keeps it.
image boot.vfat {
	vfat {
		extraargs = "-F 32 -s 64 -n WATTLINE"
		files = { "Image", "f133.dtb", "rootfs.sqfs" }
	}
	size = 4G
}
image sdcard.img {
	hdimage {
	}
	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 2040K
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 4M
	}
}

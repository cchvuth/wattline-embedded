# The image's own dash settings (/usr/lib/dash/dash.conf): a development dash on the card (/mnt/sd/dash, with its own
# dash.conf) wins when there is one (S05dash). The SRNUBI T313D: its 720x1920 MIPI-DSI panel in landscape
# (1920x720), the phone app's layout.
fb = /dev/fb0
rotate = 270
frame_ms = 16               # 60 frames a second: the panel's 58.5 Hz
# the JD9366T touch reports the panel's own portrait coordinates (720x1920): LVGL turns them with the picture
touch = /dev/input/event0
touch_swap = 0
touch_cal = 0, 0, 719, 1919
watchdog = 0                # a reset loses the Wi-Fi chip until power off and on (S05dash watches for a hung dash)
panda_host = 192.168.4.1    # the Commander's Panda on S3XY_OBD
# the log beside the others (S02sd): the boot's folder in /data/log with "Save logs" on, else nowhere (/dev/null)
log = /var/log/sd/dash.log

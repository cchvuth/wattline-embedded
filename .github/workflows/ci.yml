name: CI

# Builds + tests the head-unit app (app/, both device profiles) and the firmwares' C tools on every push/PR.
# The full firmware IMAGES (os/, os-f133/) are Buildroot builds (toolchain + kernel + packages, ~1-2 h);
# they are not built here yet — see "Firmware image" in the README.
#
# The app's signal tables are generated from the Flutter app repo (cchvuth/wattline:
# lib/signals.dart, test/obd_test.dart). CI checks that out next to the repo so app/'s
# `../wattline` path resolves. If that repo is private, add a repo secret WATTLINE_TOKEN
# (a PAT with read access); if it is public the default token is enough.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (os/, os-f133/, app/)
        uses: actions/checkout@v5
      - name: Checkout signal source (cchvuth/wattline)
        uses: actions/checkout@v5
        with:
          repository: cchvuth/wattline
          path: wattline              # app/ Makefile reads ../wattline/lib/signals.dart
          token: ${{ secrets.WATTLINE_TOKEN || github.token }}
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential python3 pkg-config libglib2.0-dev
      - name: Fetch vendored LVGL (gitignored in the repo)
        run: git clone --depth 1 -b v9.6.0 https://github.com/lvgl/lvgl app/third_party/lvgl-9.6.0
      - name: Unit tests (decode, derive, bright, settings, wifi, actions, sec1)
        run: mkdir -p app/build && make -C app test
      - name: Commander tests (messages, session, link)
        run: make -C app -f cmdr.mk test
      - name: Headless app builds (the T113 Dash, the F133 screen)
        run: make -C app -f app.mk host && make -C app -f app.mk host DEVICE=f133

  firmware-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libglib2.0-dev
      - name: Build + self-test the Android Auto receiver (aa), and a session with a fake phone (--conn-test)
        run: |
          cc -O2 -Wall -DAA_BT $(pkg-config --cflags gio-2.0 gio-unix-2.0) \
            -o /tmp/aa app/aa/aa.c app/core/pb.c -lssl -lcrypto $(pkg-config --libs gio-2.0 gio-unix-2.0)
          /tmp/aa --selftest && /tmp/aa --conn-test
      - name: Host-compile the H.264 decoder (spike-vdec) and check its picture conversion (--rotate)
        run: cc -O2 -Wall -Werror -o /tmp/spike-vdec app/vdec/spike-vdec.c && /tmp/spike-vdec --rotate
      - name: The F133 screen's tools (mcud against a pty playing its MCU; aa mcu through mcud; nor.sh with fake flash; norw's checks; dash-nor; the update's try and keep; dash-aa)
        run: |
          cc -O2 -Wall -o /tmp/mcud os-f133/package/mcud/src/mcud.c && python3 -I os-f133/package/mcud/src/test_mcud.py /tmp/mcud
          cc -O2 -Wall -DAA_MCU=1 -o /tmp/aa-mcu app/aa/aa.c app/core/pb.c -lssl -lcrypto -lpthread
          python3 -I os-f133/test/test_aa_mcu.py /tmp/mcud /tmp/aa-mcu
          docker run --rm -v "$PWD/os-f133/tools/nor":/n:ro debian:stable sh /n/test_nor_sh.sh
          cc -O2 -Wall -o /tmp/norw os-f133/tools/nor/norw.c && sh os-f133/tools/nor/test_norw.sh /tmp/norw
          docker run --rm -v "$PWD":/r:ro debian:stable sh /r/os-f133/test/test_dash_nor.sh
          docker run --rm -v "$PWD":/r:ro debian:stable sh /r/os-f133/test/test_ota_try.sh
          docker run --rm --privileged -e DEBIAN_FRONTEND=noninteractive -v "$PWD":/r:ro debian:stable sh -c 'apt-get -qq update && apt-get -qq install -y busybox >/dev/null && sh /r/os-f133/test/test_dash_aa.sh && sh /r/os-f133/test/test_log_fallback.sh'

  decoder-neon:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: The decoder's NEON picture conversion against its plain C (--rotate, on ARM)
        run: cc -O2 -Wall -Werror -o /tmp/spike-vdec app/vdec/spike-vdec.c && /tmp/spike-vdec --rotate

  ota-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The updater (dash-update) against a local HTTPS release server, in a scratch container
        run: |
          docker run --rm -v "$PWD/os:/ext:ro" debian:stable sh -c 'apt-get update -qq && apt-get install -y -qq \
            busybox curl openssl ca-certificates python3 gcc libc6-dev libssl-dev util-linux >/dev/null && \
            sh /ext/board/dash/test/dash-update-test.sh /ext'

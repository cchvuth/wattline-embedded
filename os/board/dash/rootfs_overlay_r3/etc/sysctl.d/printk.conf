# R3: only warnings and worse reach the console (ttyS0); dmesg keeps everything. Applied by S02sysctl.
kernel.printk = 4 4 1 7
# Logs reach the card within ~3 s (not 30): a watchdog reset or a power cut keeps the lines that explain it.
vm.dirty_expire_centisecs = 300
vm.dirty_writeback_centisecs = 100
# A kernel panic reboots in 5 s instead of freezing on the boot screen for the whole drive.
kernel.panic = 5

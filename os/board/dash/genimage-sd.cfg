# Card D (plan 4.5): SPL+U-Boot raw at 8 KiB; p1 boot FAT32 64 MiB; p2 DASHDATA FAT32 8 GiB, empty (the backup goes here)
image boot.vfat {
	vfat {
		extraargs = "-F 32 -n BOOT"
		files = { "zImage", "dash-r0.dtb", "rootfs.cpio.uboot", "boot.scr" }
	}
	size = 64M
}
image dashdata.vfat {
	vfat {
		extraargs = "-F 32 -n DASHDATA"
		files = { "DASHDATA.txt" }
	}
	size = 8G
}
image sdcard.img {
	hdimage {
	}
	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}
	partition data {
		partition-type = 0xC
		image = "dashdata.vfat"
	}
}

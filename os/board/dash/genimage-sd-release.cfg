# Release card image: SPL+U-Boot raw at 8 KiB; p1 boot FAT32 64 MiB; p2 DASHDATA FAT32 16 MiB (small, so the image is
# tiny to download). On first boot S05data runs dash-mkdata, which carves p3 (/data, ext4, 1 GiB) from the card's free
# space, so settings and the AA cert persist. Burn with any imager; works on any card >= ~1.2 GiB.
image boot.vfat {
	vfat {
		extraargs = "-F 32 -n BOOT"
		files = { "zImage", "dash-r0.dtb", "rootfs.cpio.uboot", "boot.scr" }
	}
	size = 64M
}
image dashdata.vfat {
	vfat {
		extraargs = "-F 32 -n DASHDATA"
		files = { "DASHDATA.txt" }
	}
	size = 16M
}
image sdcard.img {
	hdimage {
	}
	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K
	}
	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}
	partition data {
		partition-type = 0xC
		image = "dashdata.vfat"
	}
}

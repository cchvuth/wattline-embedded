# IPv6 stays link-local: no router advertisements, so no SLAAC address. A global one would carry the Wi-Fi MAC and put
# the Dash's services (SSH, when on) in reach beyond the home router's IPv4 NAT. What wants IPv6 here serves the phone on
# the Dash's own access point, where link-local is all it needs.
net.ipv6.conf.default.accept_ra = 0
net.ipv6.conf.all.accept_ra = 0
# usb0 (the USB gadget, built in) exists before this file is applied, and an existing interface keeps its own value
net.ipv6.conf.usb0.accept_ra = 0

# R4 override (precedence over r2): load the concurrent/AP-capable Wi-Fi driver (8733bs_cc) instead of the stock
# station-only 8733bs, so hostapd can bring up the Android Auto access point (and wlan1 appears for AP+station).
# hci_uart: BT over serdev on UART3; btrtl loads the RTL8733BS BT firmware.
8733bs_cc
hci_uart

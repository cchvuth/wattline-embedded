# RTL8733BS WiFi: Realtek's EU/ETSI channel plan 0x5E (ETSI 2.4 GHz plan 02, ETSI 5 GHz plan 03; what the driver's
# regdb maps every EU country to). The driver keeps its own self-managed wiphy regdomain; cfg80211 stays on world (00).
# TX power: driver default (rtw_tx_pwr_lmt_enable left at 0).
options 8733bs rtw_channel_plan=0x5E rtw_drv_log_level=2
# rtw_drv_log_level=2: errors only (the default 4 floods the console)
